<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Загрузка подарка...</title>
    <script type="text/javascript">
        // Берем весь путь (например, /test/PROMO2026)
        var path = window.location.pathname;
        // Перенаправляем на главную страницу, пряча путь в параметр "?p="
        window.location.replace(window.location.origin + '/test/?p=' + encodeURIComponent(path));
    </script>
</head>

</body>
</html>
