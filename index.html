<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Получить промокод HELM77ZX</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a202c 0%, #2d3748 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #fff;
        }
        .container {
            background: #ffffff;
            color: #2d3748;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 360px;
            text-align: center;
            box-sizing: border-box;
        }
        h2 {
            margin-top: 0;
            font-size: 22px;
            color: #1a202c;
        }
        p {
            font-size: 14px;
            color: #718096;
            margin-bottom: 20px;
        }
        /* Контейнер для iframe капчи */
        .captcha-zone {
            width: 100%;
            height: 210px; /* Высота подстроена под размер капчи */
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
            background: #fff;
            margin-bottom: 10px;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* Блок с промокодом (изначально скрыт) */
        .promo-zone {
            display: none; /* Скрыт до прохождения капчи */
            animation: fadeIn 0.5s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .promo-box {
            background: #ebf8ff;
            border: 2px dashed #3182ce;
            color: #2b6cb0;
            font-size: 24px;
            font-weight: bold;
            padding: 15px;
            border-radius: 8px;
            letter-spacing: 2px;
            margin: 15px 0;
        }
        .btn-copy {
            width: 100%;
            background: #3182ce;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-copy:hover {
            background: #2b6cb0;
        }
        .success-badge {
            color: #38a169;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ЭТАП 1: Защита капчей -->
    <div id="captchaStage">
        <h2>Активация бонуса</h2>
        <p>Подтвердите, что вы не робот, чтобы забрать свой промокод</p>
        <div class="captcha-zone">
            <!-- Подключаем ваш фрейм капчи -->
            <iframe 
                src="https://github.io" 
                id="captchaIframe"
                sandbox="allow-scripts allow-same-origin">
            </iframe>
        </div>
    </div>

    <!-- ЭТАП 2: Показ промокода (откроется после капчи) -->
    <div id="promoStage" class="promo-zone">
        <div class="success-badge">🎉 Проверка успешно пройдена!</div>
        <h2>Ваш промокод готов!</h2>
        <p>Скопируйте его и используйте при оформлении</p>
        
        <!-- Сам промокод -->
        <div class="promo-box" id="promoCode">HELM77ZX</div>
        
        <button class="btn-copy" id="copyPromoBtn">Скопировать промокод</button>
    </div>
</div>

<script>
    // Слушаем сигналы из iframe
    window.addEventListener('message', function(event) {
        // Безопасность: реагируем только на сообщения от вашего домена на GitHub
        if (event.origin !== 'https://github.io') {
            return; 
        }

        // Если капча прислала объект со статусом успеха
        if (event.data && event.data.status === 'success') {
            
            // Скрываем блок с капчей
            document.getElementById('captchaStage').style.display = 'none';
            
            // Показываем блок с промокодом
            document.getElementById('promoStage').style.display = 'block';
        }
    });

    // Логика кнопки копирования промокода
    document.getElementById('copyPromoBtn').addEventListener('click', function() {
        const promoText = document.getElementById('promoCode').innerText;
        
        navigator.clipboard.writeText(promoText).then(() => {
            const btn = document.getElementById('copyPromoBtn');
            btn.innerText = '✓ Скопировано!';
            btn.style.background = '#38a169';
            
            // Возвращаем исходный текст кнопки через 2 секунды
            setTimeout(() => {
                btn.innerText = 'Скопировать промокод';
                btn.style.background = '#3182ce';
            }, 2000);
        }).catch(err => {
            console.error('Ошибка копирования: ', err);
        });
    });
</script>

</body>
</html>
