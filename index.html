<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шахматы с рекламой</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: Arial, sans-serif;
            background-color: #312e2b;
            color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Полноэкранный оверлей для входа */
        #fullscreen-prompt {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        #fullscreen-prompt button {
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            background-color: #81b64c;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s;
        }
        #fullscreen-prompt button:hover {
            background-color: #a3d96c;
        }

        /* Шахматное поле */
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .board {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            border: 4px solid #1f1e1c;
        }
        .cell {
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            cursor: pointer;
            user-select: none;
        }
        .light { background-color: #eeeed2; color: #b58863; }
        .dark { background-color: #769656; color: #eeeed2; }
        .selected { background-color: #baca44 !important; }

        /* Полноэкранная реклама */
        #ad-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
            cursor: pointer;
        }
        #ad-video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #ad-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.7);
            color: #fff;
            border: 2px solid #fff;
            border-radius: 50%;
            font-size: 30px;
            display: none; /* Скрыт по умолчанию */
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10001;
            user-select: none;
        }
        #ad-close:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <!-- Экран запроса полноэкранного режима -->
    <div id="fullscreen-prompt">
        <h2 style="margin-bottom: 20px; text-align: center;">Для начала игры необходимо развернуть экран</h2>
        <button id="fullscreen-btn">На весь экран</button>
    </div>

    <!-- Основная игра -->
    <div id="game-container">
        <h2 style="margin-bottom: 10px;">Ходов до рекламы: <span id="move-counter">3</span></h2>
        <div class="board" id="board"></div>
    </div>

    <!-- Полноэкранный блок рекламы -->
    <div id="ad-overlay" id="ad-box">
        <video id="ad-video" src="e32b23bad68111f19a2afe9193507f5f.mp4" loop muted playsinline></video>
        <div id="ad-close">&times;</div>
    </div>

    <script>
        const promptOverlay = document.getElementById('fullscreen-prompt');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        const board = document.getElementById('board');
        const moveCounterEl = document.getElementById('move-counter');
        const adOverlay = document.getElementById('ad-overlay');
        const adVideo = document.getElementById('ad-video');
        const adClose = document.getElementById('ad-close');

        let moveCount = 0;
        const movesPerAd = 3;
        let selectedCell = null;

        // Полноэкранный режим логика
        fullscreenBtn.addEventListener('click', () => {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            } else if (document.documentElement.mozRequestFullScreen) {
                document.documentElement.mozRequestFullScreen();
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen();
            } else if (document.documentElement.msRequestFullscreen) {
                document.documentElement.msRequestFullscreen();
            }
        });

        function onFullscreenChange() {
            if (!document.fullscreenElement && 
                !document.webkitFullscreenElement && 
                !document.mozFullScreenElement && 
                !document.msFullscreenElement) {
                // Игрок вышел из полноэкранного режима
                promptOverlay.style.display = 'flex';
                adVideo.pause();
                adOverlay.style.display = 'none';
            } else {
                // Игрок вошел в полноэкранный режим
                promptOverlay.style.display = 'none';
            }
        }

        document.addEventListener('fullscreenchange', onFullscreenChange);
        document.addEventListener('webkitfullscreenchange', onFullscreenChange);
        document.addEventListener('mozfullscreenchange', onFullscreenChange);
        document.addEventListener('MSFullscreenChange', onFullscreenChange);

        // Рекламная логика
        function triggerAd() {
            adOverlay.style.display = 'flex';
            adClose.style.display = 'none'; // Скрываем крестик при старте
            
            adVideo.currentTime = 0;
            adVideo.play().catch(err => console.log("Автовоспроизведение видео заблокировано браузером до клика"));

            // Появление крестика через 3 секунды
            setTimeout(() => {
                adClose.style.display = 'flex';
            }, 3000);
        }

        // Клик по оверлею рекламы (но не по крестику)
        adOverlay.addEventListener('click', (e) => {
            if (e.target === adClose) {
                // Если нажали на крестик - закрываем
                adVideo.pause();
                adOverlay.style.display = 'none';
                moveCount = 0;
                updateCounter();
            } else {
                // Если нажали в любое другое место - редирект
                window.open('https://t.me/LifeMod_VS', '_blank');
            }
        });

        function updateCounter() {
            moveCounterEl.textContent = movesPerAd - moveCount;
        }

        // Шахматная доска (Визуальная заглушка)
        const startingPieces = [
            ['♜','♞','♝','♛','♚','♝','♞','♜'],
            ['♟','♟','♟','♟','♟','♟','♟','♟'],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['','','','','','','',''],
            ['♙','♙','♙','♙','♙','♙','♙','♙'],
            ['♖','♘','♗','♕','♔','♗','♘','♖']
        ];

        function createBoard() {
            board.innerHTML = '';
            for (let row = 0; row < 8; row++) {
                for (let col = 0; col < 8; col++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.classList.add((row + col) % 2 === 0 ? 'light' : 'dark');
                    cell.dataset.row = row;
                    cell.dataset.col = col;
                    cell.textContent = startingPieces[row][col];
                    
                    cell.addEventListener('click', () => handleCellClick(cell));
                    board.appendChild(cell);
                }
            }
        }

        function handleCellClick(cell) {
            if (selectedCell) {
                if (selectedCell !== cell) {
                    // Перемещаем фигуру (упрощенно)
                    cell.textContent = selectedCell.textContent;
                    selectedCell.textContent = '';
                    selectedCell.classList.remove('selected');
                    selectedCell = null;
                    
                    // Считаем ход
                    moveCount++;
                    updateCounter();
                    
                    if (moveCount >= movesPerAd) {
                        triggerAd();
                    }
                } else {
                    cell.classList.remove('selected');
                    selectedCell = null;
                }
            } else {
                if (cell.textContent !== '') {
                    selectedCell = cell;
                    cell.classList.add('selected');
                }
            }
        }

        createBoard();
        updateCounter();
    </script>
</body>
</html>
