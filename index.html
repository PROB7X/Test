<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой Одностраничный Сайт</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 50px; }
        .reward-box { display: none; background: #e0ffd0; border: 2px solid #40a020; padding: 20px; margin: 20px auto; max-width: 400px; border-radius: 8px; }
    </style>
</head>
<body>

    <h1>Добро пожаловать на сайт!</h1>
    <p>Это главная страница, дополнительных файлов нет.</p>

    <!-- Блок с наградой, который изначально скрыт -->
    <div id="rewardBlock" class="reward-box">
        <h2>🎉 Поздравляем!</h2>
        <p>Вы вошли по промо-ссылке и получили свою награду!</p>
    </div>

    <script>
        // Функция, которая сработает сразу при загрузке страницы
        window.addEventListener('DOMContentLoaded', () => {
            
            // 1. Получаем хэш из адресной строки (например, "#promo1")
            const currentHash = window.location.hash;

            // 2. Проверяем, совпадает ли хэш с вашим промокодом
            if (currentHash === '#promo1') {
                
                // Действие: Показываем блок с наградой
                document.getElementById('rewardBlock').style.display = 'block';
                
                // Здесь также можно вызвать функцию отправки награды на сервер (fetch/axios), 
                // если у вас есть полноценная регистрация или база данных.

                // 3. Убираем хэш из адресной строки, возвращая чистый домен site.domen/
                // Метод replaceState меняет URL без перезагрузки страницы
                history.replaceState(null, document.title, window.location.pathname + window.location.search);
            }
        });
    </script>
</body>
</html>
