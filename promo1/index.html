<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Активация промокода...</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; background: #eef9f0; }
        .loader { font-size: 1.5em; color: #28a745; font-weight: bold; }
    </style>
</head>
<body>

    <div class="loader">
        ⚙️ Настройка промокода... Сейчас вы будете перенаправлены.
    </div>

    <script>
        // 1. Записываем в LocalStorage флаг активации
        localStorage.setItem('my_promo_gift', 'activated');

        // 2. Через 1 секунду перекидываем пользователя на главную
        setTimeout(function() {
            window.location.href = "index.html";
        }, 1000); 
    </script>

</body>
</html>
